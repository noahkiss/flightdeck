# Example config for one gff-hab (docs/specs/mesh.md 5.4). Unlike the peer list, it is per host.
#
# Pass it with `gff-hab serve -config <file>`, set $GFF_HAB_CONFIG, or copy it to gff/hab.toml
# in your config directory:
#   macOS:  ~/Library/Application Support/gff/hab.toml
#   others: $XDG_CONFIG_HOME/gff/hab.toml, else ~/.config/gff/hab.toml
#
# gff-hab reads it at start and every 5 minutes. Every name below is a placeholder.

# The [catalog] section: what this hab adds to its catalog, besides what it detects.
[catalog]
# Extra capability words. Detected words (linux, macos, xcode, docker, gpu) need no entry.
capabilities = ["signing", "printer"]
# Folders to scan for git projects, to a depth of 3. With none, the catalog lists only the
# projects gff-hab already has sessions in.
project_roots = ["~/code"]
# Mark this host always on. Its peers raise one notification when it stays offline.
always_on = false
# How long a peer marked always on stays offline before this hab raises that notification.
always_on_alert = "30m"

[[catalog.services]]
name = "docs"
url = "http://localhost:2799"
health = "http://localhost:2799/health"

[[catalog.actions]]
name = "update"
command = "make update"

# The [read] section: the read scope of the agent kit's read tools (docs/specs/capcom.md 5).
# The default roots are this host's project folders, the harnesses' transcript folders and
# Capcom's folder. The default deny list covers SSH and cloud credential folders, .env files
# (not .env.example, .env.sample or .env.template) and private key files. Deny wins, after links
# are resolved.
[read]
# More roots the read tools may read under, added to the default roots: absolute, or under ~/.
allow = ["~/notes"]
# Leave deny out to use the default deny list. A deny list replaces the default list: here only
# these patterns are refused, so .env and *.pem become readable. A word with no slash matches any
# part of a path; one that starts with / or ~/ matches from the start; one that starts with !
# exempts a name from the slash-free words.
# deny = ["~/code/payroll", "*.sqlite", ".env*", "!.env.example"]
# An empty list turns the default deny list off.
# deny = []

# The [speech] section: the hab speech engine (docs/specs/voice.md, Hab speech engine).
[speech]
# On or off. Leave it out for the default: on for a host sold as 4 GB or more.
enabled = true
# The helper program. Leave it out to use $GFF_HAB_SPEECH_HELPER, gff-hab-speech beside gff-hab,
# or gff-hab-speech on PATH.
helper = "/usr/local/bin/gff-hab-speech"
# A mirror of the model archive. The checksum is still checked.
# model_url = "https://mirror.example.com/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8.tar.bz2"
# Decode threads. Leave it out for the CPU count, at most 4.
threads = 4

# The [summaries] section: model-written titles for approval banners (docs/specs/app.md 16.5).
# Off unless base_url and model are set. With it on, the command, file names, URL or tool input
# of each approval, the harness's own summary and the project name go to this endpoint.
[summaries]
# An OpenAI-compatible API root; the hab posts to <base_url>/chat/completions. A local server
# (Ollama, LM Studio) keeps the text on this network.
base_url = "http://127.0.0.1:11434/v1"
model = "qwen3:4b"
# The command that prints the API key, as an argv with no shell (as push's key_command,
# docs/push.md). Leave it out for a local server that needs no key.
# key_command = ["pass", "show", "flightdeck/summaries-key"]
# "off" (the default), "minimal", "low", "medium", "high", or "default" to send neither
# reasoning_effort nor max_tokens, for an endpoint that refuses one (OpenAI's own models).
thinking = "off"
# How long a banner waits for its summary. Leave it out for 1.5s; 0.2s to 5s.
# timeout = "1.5s"

# The [capcom] section: the Capcom session host (docs/specs/capcom.md 7.6).
[capcom]
# The harness a new Capcom conversation runs: "claude" (the default), "codex" or "opencode".
# A conversation keeps its harness when it resumes.
harness = "claude"
# The Capcom service (docs/specs/capcom-service.md 3.5, 19.2). Leave engine out to keep the
# pane Capcom above; "claude" runs the service on the Claude Agent SDK instead, "codex" on the
# Codex SDK. A change of engine keeps the thread and its memory (a re-seed).
# engine = "claude"
# The login. Claude: "oauth_token" (the default: your own subscription, through the long-lived
# token `claude setup-token` makes) or "api_key". Codex: "login" (the default: your own
# `codex login`, which gff-hab never reads) or "api_key". This file never holds a token or a
# key: name a command that prints it, as an argv with no shell. A hand-run gff-hab serve may
# take CLAUDE_CODE_OAUTH_TOKEN, ANTHROPIC_API_KEY or, for Codex, OPENAI_API_KEY from its own
# environment instead.
# auth = "oauth_token"
# oauth_token_command = ["your-credential-tool", "read", "claude-token"]
# api_key_command = ["your-credential-tool", "read", "anthropic-key"]
# model = ""        # the main model; empty for the SDK's default (gpt-5.5 under codex)
# small_model = ""  # event turns' first look and the summary
# Limits, each with its default; a value outside its range is logged once and the default runs.
# max_turns = 50              # 1 to 500 model calls a turn
# max_turn_usd = 2            # above 0; the SDK's spend limit per turn
# daily_usd = 10              # above 0; none by default (an API key's daily cap)
# restart_delay = "5s"        # 1s to 10m before a crashed engine starts again
# crash_limit = 5             # 1 to 100 crashes in crash_window stop the restarts
# crash_window = "10m"        # 1m to 24h
# route_backoff_max = "30s"   # 1s to 10m; the engine's reconnect backoff
# typing_timeout = "10m"      # 1m to 1h of typing with no engine message
# command_timeout = "30s"     # 1s to 5m for oauth_token_command and api_key_command
# token_retry = "5m"          # 30s to 24h before a refused credential is read again
# wake_retry = "10s"          # 1s to 5m before a model call that failed at wake is retried
# The context manager (docs/specs/capcom-service.md 6):
# summary_max_chars = 6000    # 1,000 to 50,000 characters of summary
# summary_input_chars = 64000 # 8,000 to 400,000 characters of new items a summary call reads
# summary_quiet = "10m"       # 1m to 24h quiet after a turn before the summary updates
# reseed_at = 60              # 20 to 90 percent of the window at a turn's end starts a re-seed
# reseed_quiet = "60m"        # 10m to 24h quiet before a re-seed above reseed_quiet_at
# reseed_quiet_at = 25        # 0 to reseed_at percent
# reseed_early_at = 45        # 10 to reseed_at percent; the size trigger for an engine with no compaction events (codex)
# seed_messages = 6           # 0 to 50 messages in a seed
# seed_messages_chars = 8000  # 0 to 64,000 characters for those messages; the oldest go first
# seed_logbook_bytes = 8192   # 0 to 65,536 bytes of Logbook in a seed
# precompact_timeout = "30s"  # 5s to 5m for the summary before a compaction or a re-seed

# The [settings] table: hab-side settings this host locks (docs/specs/app.md 20.5). A setting
# named here is set by this file: the hab enforces the value and refuses writes from the app,
# which shows the row read-only. Leave a setting out to let the app set it. Keys are quoted.
# gff-hab reads this table again a few seconds after the file changes.
[settings]
# Confirm before an agent starts work on another host: true or false.
# "confirm.start_elsewhere" = false
# Remote answers expire after this many minutes: 0 for never, else 1 to 1440.
# "approval.max_age" = 60
# Require approval for memories: "off" or "agents".
# "logbook.approval" = "off"
# Wait this many seconds for the app's answer to a permission hook: 0 for off, else 1 to 120.
# "hab.permission_wait" = 30
# The Logbook recording habits (docs/specs/logbook.md 11): true or false, each on by default.
# "logbook.habits.brief" = true
# "logbook.habits.reminder" = true
# "logbook.habits.closeout" = true
# Ask before a group start; the answer also trusts the group's worktrees (docs/specs/groups.md
# 3.2, 4.2): true or false.
# "confirm.group_plan" = true
# The heavy-run lock (docs/specs/groups.md 8): heavy runs at once on this host, 1 to 8.
# "heavy.slots" = 1
# Hold heavy runs while a volume has less than this many GiB free: 0 for never, else to 4096.
# "heavy.disk_min_free" = 10
# Notify when one heavy run holds the lock longer than this many minutes: 5 to 1440.
# "heavy.long_hold" = 60
# Capcom approval cards expire after this many minutes: 1 to 1440 (no 0).
# "capcom.approval_max_age" = 10

# The [logbook.habits_off] table: turn a recording habit off for one project (docs/specs/logbook.md
# 11.4). Keys are a Logbook project id or an identity, the git remote as the catalog prints it;
# values list the habits to turn off: "brief", "reminder", "closeout". gff-hab reads it again
# when the file changes.
[logbook.habits_off]
# "github.com/owner/repo" = ["closeout"]

# The [rounds] section: scheduled runs (docs/specs/rounds.md 7.2, 8.3).
[rounds]
# At most this many runs at once on this host; others wait as queued.
max_running = 2
# How long due runs wait after a wake or a gff-hab start; "0s" for none.
wake_settle = "30s"
# Event rounds (rounds.md 4.5): a pending batch keeps at most this many events and bytes,
# dropping the oldest and counting them.
batch_max_events = 200
batch_max_bytes = 262144
# Keep the event files of this many ended runs per round; 0 keeps none.
event_files_keep = 20
# The events block in a run's first message: at most this many events, this many bytes, and
# this many bytes of each event's data.
block_max_events = 50
block_max_bytes = 32768
block_data_max = 1024
# How often a changed pending batch is saved.
state_save_every = "10s"
# How long a capcom run waits for Capcom's outcome before it reads unknown.
outcome_wait = "7d"

# The [heavy] section: the heavy-run lock that `gff heavy -- <command>` takes (docs/specs/groups.md
# 8). A value outside its range is logged and the default runs.
[heavy]
# After a gff-hab start, grant nothing for this long, so runs from before the restart come back
# first: "0s" to "60s".
restart_hold = "10s"
# Once free space was low, grant again only when it is this many GiB above heavy.disk_min_free:
# 0 to 100.
disk_resume_margin = 2

# The [groups] section: agent groups (docs/specs/groups.md 15.3). A value outside its range is
# logged and the default runs.
[groups]
# How long this hab holds a group member's folder trust prompt back while it answers it, before
# the trust card shows: "1s" to "60s".
trust_hold = "10s"
# How long an ended or dropped group's record stays on its home hab, in whole days: 1 to 365.
keep_ended = 30
# Reports kept for a coordinator that is not running (10 to 5000), and how long each waits, in
# whole days (1 to 90). The oldest go first.
inbox_max = 200
inbox_days = 7

# The [aliases] table: words an agent may name instead of a harness when it spawns a teammate
# (docs/specs/harness-adapters.md, Spawn), so "a gpt reviewer" picks the right harness and
# model. Each alias names a harness (claude, codex or opencode) and, optionally, a model. An
# alias may shadow a harness word, to give that harness a model. A model the agent names wins
# over the alias's. Aliases are lowercase letters, digits, '.', '_' and '-'. gff-hab reads the
# table again when the file changes; a bad entry is logged and left out.
[aliases]
# gpt = { harness = "codex", model = "gpt-5.5" }
# opus = { harness = "claude", model = "opus" }
# sonnet = { harness = "claude", model = "sonnet" }
