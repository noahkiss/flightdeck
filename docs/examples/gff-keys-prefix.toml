# Sample gff keymap: one prefix key, tmux style (docs/specs/gff-client.md 15.5, option B).
#
# gff's default keymap is modes with Ctrl leaders, as zellij's: Ctrl+G lock, Ctrl+P pane mode,
# Ctrl+T tab mode, Ctrl+O session mode, and Alt+h/j/k/l and Alt+i/o. This file replaces it with
# one prefix key, Ctrl+\, that leads to every command (session mode is the prefix's mode here)
# and takes no other Ctrl or Alt key from programs. To use it, copy the tables
# below into gff's config file (-config, else $GFF_CONFIG, else gff/config.toml in your config
# directory), beside any [[hosts]] tables. `gff -prefix ctrl-<key>` moves the prefix.
#
# The prefix takes one key, then gff is back in normal mode:
#   Ctrl+\ w  sidebar        Ctrl+\ p  pane mode     Ctrl+\ l  lock (Ctrl+G unlocks)
#   Ctrl+\ g  board          Ctrl+\ t  tab mode      Ctrl+\ d  detach
#   Ctrl+\ c  new tab        Ctrl+\ ]  next tab      Ctrl+\ [  previous tab
#   Ctrl+\ R  hide or show run sessions
#
# On the board, r runs the selected round now and p pauses or unpauses it; R in the sidebar
# and on the board hides or shows run sessions.
#
# Ctrl+\ pressed twice sends Ctrl+\ to the program. Locked mode sends Ctrl+\ as it is.
# In pane and tab mode, a focus or tab move keeps the mode; another command ends it.

[keys]
clear-defaults = true # these tables are the whole keymap

[keys.normal]
'ctrl-\' = "session-mode"

[keys.locked]
"ctrl-g" = "unlock"

[keys.session]
w = "sidebar"
g = "board"
p = "pane-mode"
t = "tab-mode"
c = "new-tab"
"]" = "next-tab"
"[" = "prev-tab"
x = "close-view"
z = "zoom"
o = "focus-next"
tab = "focus-next"
s = "split"
"%" = "new-pane-right"
'"' = "new-pane-down"
"+" = "new-pane"
l = "lock"
b = "bars"
"!" = "warnings"
r = "redraw"
n = "nudge"
f = "fit"
d = "detach"
R = "run-sessions"
esc = "back"
1 = "tab-1"
2 = "tab-2"
3 = "tab-3"
4 = "tab-4"
5 = "tab-5"
6 = "tab-6"
7 = "tab-7"
8 = "tab-8"
9 = "tab-9"

[keys.pane]
"+" = "new-pane"
"%" = "new-pane-right"
'"' = "new-pane-down"
o = "focus-next"
tab = "focus-next"
z = "zoom"
s = "split"
x = "close-view"
r = "redraw"
n = "nudge"
f = "fit"
esc = "back"
enter = "back"

[keys.tab]
c = "new-tab"
"]" = "next-tab"
"[" = "prev-tab"
1 = "tab-1"
2 = "tab-2"
3 = "tab-3"
4 = "tab-4"
5 = "tab-5"
6 = "tab-6"
7 = "tab-7"
8 = "tab-8"
9 = "tab-9"
x = "close-view"
esc = "back"
enter = "back"

[keys.sidebar]
up = "up"
k = "up"
down = "down"
j = "down"
enter = "open"
t = "open-tab"
n = "new-session"
r = "rename"
x = "close-session"
"/" = "filter"
p = "group"
R = "run-sessions"
esc = "back"
q = "back"

[keys.board]
up = "up"
k = "up"
down = "down"
j = "down"
enter = "open"
t = "open-tab"
r = "run-now"
p = "pause"
R = "run-sessions"
esc = "back"
q = "back"
