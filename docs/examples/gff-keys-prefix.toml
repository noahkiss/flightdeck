# Sample gff keymap: one prefix key, tmux style (docs/specs/gff-client.md 15.5, option B).
#
# gff's default keymap is modes with Ctrl leaders, as zellij's: Ctrl+G lock, Ctrl+P pane mode,
# Ctrl+T tab mode, Ctrl+O command mode. This file replaces it with one prefix key, Ctrl+\, that
# leads to every command and takes no other Ctrl key from programs. To use it, copy the tables
# below into gff's config file (-config, else $GFF_CONFIG, else gff/config.toml in your config
# directory), beside any [[hosts]] tables. `gff -prefix ctrl-<key>` moves the prefix.
#
# The prefix takes one key, then gff is back in normal mode:
#   Ctrl+\ w  sidebar        Ctrl+\ p  pane mode     Ctrl+\ l  lock (Ctrl+G unlocks)
#   Ctrl+\ g  board          Ctrl+\ t  tab mode      Ctrl+\ d  detach
#   Ctrl+\ c  new tab        Ctrl+\ ]  next tab      Ctrl+\ [  previous tab
#
# Ctrl+\ pressed twice sends Ctrl+\ to the program. Locked mode sends Ctrl+\ as it is.
# In pane and tab mode, a focus or tab move keeps the mode; another command ends it.

[keys]
clear-defaults = true # these tables are the whole keymap

[keys.normal]
'ctrl-\' = "prefix"

[keys.locked]
"ctrl-g" = "unlock"

[keys.prefix]
w = "sidebar"
g = "board"
p = "pane-mode"
t = "tab-mode"
c = "new-tab"
"]" = "next-tab"
"[" = "prev-tab"
x = "close-view"
z = "zoom"
o = "focus-next"
tab = "focus-next"
s = "split"
l = "lock"
b = "bars"
"!" = "warnings"
r = "redraw"
n = "nudge"
f = "fit"
d = "detach"
esc = "back"
1 = "tab-1"
2 = "tab-2"
3 = "tab-3"
4 = "tab-4"
5 = "tab-5"
6 = "tab-6"
7 = "tab-7"
8 = "tab-8"
9 = "tab-9"

[keys.pane]
o = "focus-next"
tab = "focus-next"
z = "zoom"
s = "split"
x = "close-view"
r = "redraw"
n = "nudge"
f = "fit"
esc = "back"
enter = "back"

[keys.tab]
c = "new-tab"
"]" = "next-tab"
"[" = "prev-tab"
1 = "tab-1"
2 = "tab-2"
3 = "tab-3"
4 = "tab-4"
5 = "tab-5"
6 = "tab-6"
7 = "tab-7"
8 = "tab-8"
9 = "tab-9"
x = "close-view"
esc = "back"
enter = "back"

[keys.sidebar]
up = "up"
k = "up"
down = "down"
j = "down"
enter = "open"
t = "open-tab"
n = "new-session"
r = "rename"
x = "close-session"
"/" = "filter"
p = "group"
esc = "back"
q = "back"

[keys.board]
up = "up"
k = "up"
down = "down"
j = "down"
enter = "open"
t = "open-tab"
esc = "back"
q = "back"
