name: Probe cold libghostty

on:
  push:
    branches: [ci-cold-libghostty-probe]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.image }} ${{ matrix.zig }} ${{ matrix.extra }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: ubuntu-latest, zig: official, extra: 'disk' }
          - { image: ubuntu-latest, zig: official, extra: 'shm' }
          - { image: ubuntu-24.04-arm, zig: official, extra: 'shm' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Environment
        run: |
          uname -a
          grep -m1 'model name' /proc/cpuinfo || true
          nproc
          grep -o -w -E 'avx512[a-z]*' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo "no io_uring_disabled"
          ulimit -a
      - name: Zig
        run: |
          set -euo pipefail
          v=$(sed -n 's/^zig = "\(.*\)"$/\1/p' mise.toml)
          a=$(uname -m)
          curl -sSfL "https://ziglang.org/download/$v/zig-$a-linux-$v.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-$a-linux-$v" >> "$GITHUB_PATH"
      - name: Build libghostty
        id: build
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          set -euo pipefail
          zig version
          a=$(uname -m)
          flags="-Dtarget=$a-linux-gnu.2.31 -Dcpu=baseline"
          env | wc -c; env | wc -l; env | cut -d= -f1 | sort | tr '\n' ' '; echo
          df -T "$HOME" /dev/shm "$RUNNER_TEMP" | cat
          if [ "$EXTRA" = shm ]; then export ZIG_GLOBAL_CACHE_DIR=/dev/shm/zig; else export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zig"; fi
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR"
          cd "$RUNNER_TEMP"
          zig fetch https://deps.files.ghostty.org/aro-d0c8c4d9c55daa7ef6e40cf0f630a5b5e900989b.tar.gz || echo "FETCH rc=$?"
          ls "$ZIG_GLOBAL_CACHE_DIR/p"; ls -la "$ZIG_GLOBAL_CACHE_DIR"/p/* | head -20
          cd "$GITHUB_WORKSPACE"
          make libghostty GHOSTTY_ZIGFLAGS="$flags"
      - name: On failure, the zig cache state
        if: failure()
        run: |
          ls -la build/ghostty-src/zig-pkg 2>/dev/null | head -50 || true
          ls ~/.cache/zig/p 2>/dev/null | head -50 || true
