name: Probe cold libghostty

on:
  push:
    branches: [ci-cold-libghostty-probe]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.image }} ${{ matrix.zig }} ${{ matrix.extra }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: ubuntu-latest, zig: official, extra: 'envi' }
          - { image: ubuntu-latest, zig: official, extra: 'verbose' }
          - { image: ubuntu-latest, zig: official, extra: 'container' }
          - { image: ubuntu-latest, zig: official, extra: 'tmphome' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Environment
        run: |
          uname -a
          grep -m1 'model name' /proc/cpuinfo || true
          nproc
          grep -o -w -E 'avx512[a-z]*' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo "no io_uring_disabled"
          ulimit -a
      - name: Zig
        run: |
          set -euo pipefail
          v=$(sed -n 's/^zig = "\(.*\)"$/\1/p' mise.toml)
          a=$(uname -m)
          curl -sSfL "https://ziglang.org/download/$v/zig-$a-linux-$v.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-$a-linux-$v" >> "$GITHUB_PATH"
      - name: Build libghostty
        id: build
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          set -euo pipefail
          zig version
          a=$(uname -m)
          flags="-Dtarget=$a-linux-gnu.2.31 -Dcpu=baseline"
          env | wc -c; env | wc -l; env | cut -d= -f1 | sort | tr '\n' ' '; echo
          case "$EXTRA" in
            envi) env -i PATH="$PATH" HOME="$HOME" make libghostty GHOSTTY_ZIGFLAGS="$flags" ;;
            verbose) make libghostty GHOSTTY_ZIGFLAGS="$flags --verbose --summary all" ;;
            container) docker run --rm -v "$PWD:/w" -v "$(dirname "$(command -v zig)"):/zig" -w /w ubuntu:24.04 bash -c "apt-get update -qq >/dev/null && apt-get install -y -qq make git >/dev/null && PATH=/zig:\$PATH make libghostty GHOSTTY_ZIGFLAGS='$flags'" ;;
            tmphome) mkdir -p "$RUNNER_TEMP/h" && HOME="$RUNNER_TEMP/h" XDG_CACHE_HOME="$RUNNER_TEMP/h/.cache" make libghostty GHOSTTY_ZIGFLAGS="$flags" ;;
          esac
      - name: On failure, the zig cache state
        if: failure()
        run: |
          ls -la build/ghostty-src/zig-pkg 2>/dev/null | head -50 || true
          ls ~/.cache/zig/p 2>/dev/null | head -50 || true
