name: Probe cold libghostty

on:
  push:
    branches: [ci-cold-libghostty-probe]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.image }} ${{ matrix.zig }} ${{ matrix.extra }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: ubuntu-latest, zig: official, extra: 'fetchprobe' }
          - { image: ubuntu-24.04-arm, zig: official, extra: 'fetchprobe' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Environment
        run: |
          uname -a
          grep -m1 'model name' /proc/cpuinfo || true
          nproc
          grep -o -w -E 'avx512[a-z]*' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo "no io_uring_disabled"
          ulimit -a
      - name: Zig
        run: |
          set -euo pipefail
          v=$(sed -n 's/^zig = "\(.*\)"$/\1/p' mise.toml)
          a=$(uname -m)
          curl -sSfL "https://ziglang.org/download/$v/zig-$a-linux-$v.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-$a-linux-$v" >> "$GITHUB_PATH"
      - name: Build libghostty
        id: build
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          set -euo pipefail
          zig version
          a=$(uname -m)
          flags="-Dtarget=$a-linux-gnu.2.31 -Dcpu=baseline"
          env | wc -c; env | wc -l; env | cut -d= -f1 | sort | tr '\n' ' '; echo
          git init -q build/ghostty-src
          git -C build/ghostty-src fetch -q --depth 1 https://github.com/ghostty-org/ghostty.git 5813c9461d5af78b6307a1254d00b1bc190eaccd
          git -C build/ghostty-src checkout -q FETCH_HEAD
          cd build/ghostty-src
          echo "== URLs"
          grep -rhoE 'https://[^"]+' --include=build.zig.zon . | sort -u > /tmp/urls.txt
          wc -l < /tmp/urls.txt
          while read -r u; do curl -sSL -o /dev/null --retry 0 -w "%{http_code} %{size_download} %{url_effective}\n" "$u" || echo "CURL-FAILED $u"; done < /tmp/urls.txt
          echo "== zig fetch each"
          while read -r u; do echo "-- $u"; timeout 120 zig fetch "$u" || echo "ZIG-FETCH-FAILED rc=$? $u"; done < /tmp/urls.txt
          echo "== zig build --fetch"
          zig build --fetch -Demit-lib-vt -Demit-xcframework=false || echo "FETCH-PHASE rc=$?"
          ls zig-pkg ~/.cache/zig/p 2>/dev/null || true
          echo "== zig build (configure only, -h)"
          zig build -h -Demit-lib-vt >/dev/null || echo "HELP-PHASE rc=$?"
          ls zig-pkg 2>/dev/null || true
          echo "== zig build"
          zig build -Demit-lib-vt -Demit-xcframework=false -Doptimize=ReleaseFast $flags --prefix /tmp/out || echo "BUILD rc=$?"
      - name: On failure, the zig cache state
        if: failure()
        run: |
          ls -la build/ghostty-src/zig-pkg 2>/dev/null | head -50 || true
          ls ~/.cache/zig/p 2>/dev/null | head -50 || true
