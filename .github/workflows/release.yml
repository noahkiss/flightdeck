name: Release

# Tags are v<upstream-version>-fd.<n>, optionally with an -rc.<m> suffix.
# iOS: archive rootshell-AppStore and upload it to App Store Connect.
# macOS: archive rootshell-Standalone, export it with Developer ID, notarize,
# staple, and attach a zip to the GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild.
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: flightdeck-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  TEAM_ID: 2Z88BYP37C
  XCODEBUILD_FLAGS: >-
    -project rootshell.xcodeproj
    -clonedSourcePackagesDirPath SourcePackages
    -skipMacroValidation
    -skipPackagePluginValidation

jobs:
  ios:
    name: iOS to App Store Connect
    runs-on: macos-26
    environment: release
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - &versions
        name: Derive versions
        # v1.0.14-fd.0-rc.1 -> marketing 1.0.14. The build number only has to
        # grow, so the workflow run number serves.
        run: |
          marketing=$(printf '%s' "$TAG" | sed -E 's/^v([0-9]+(\.[0-9]+)*).*/\1/')
          printf '%s' "$marketing" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}$' \
            || { echo "::error::cannot derive a version from tag $TAG"; exit 1; }
          echo "MARKETING_VERSION=$marketing" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Version $marketing ($GITHUB_RUN_NUMBER)"

      - &secrets
        name: Use example secrets
        env:
          GH_TOKEN: ${{ github.token }}
        # The netrc lets Swift Package Manager fetch binary targets from the
        # GitHub API with a token instead of the shared anonymous rate limit.
        run: |
          cp Configuration/Secrets.example.xcconfig Configuration/Secrets.xcconfig
          ( umask 077; printf 'machine api.github.com\n  login x-access-token\n  password %s\n' "$GH_TOKEN" > ~/.netrc )

      - &cache
        name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('rootshell.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - &keys
        name: Set up keychain and API key
        env:
          # Apple Distribution for the App Store job, Developer ID for macOS.
          CERT_P12: ${{ github.job == 'ios' && secrets.DIST_CERT_P12 || secrets.MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ github.job == 'ios' && secrets.DIST_CERT_PASSWORD || secrets.MAC_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(openssl rand -base64 24)
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          ( umask 077; printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12" )
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          echo "SIGNING_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/keys"
          ( umask 077; printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" )
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        # Automatic signing through the API key registers the bundle IDs,
        # capabilities and profiles under the team on first use, and signs
        # the archive for development; the export re-signs it.
        run: |
          set -o pipefail
          xcodebuild $XCODEBUILD_FLAGS -scheme rootshell-AppStore \
            -configuration ReleaseAppStore -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/flightdeck-ios.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive | tee archive-ios.log | grep -E '(error|warning: .*(sign|profile|entitlement)|ARCHIVE (SUCCEEDED|FAILED))' || true
          grep -q 'ARCHIVE SUCCEEDED' archive-ios.log

      - name: Export and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/flightdeck-ios.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export-ios" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee export-ios.log | grep -E '(error|EXPORT (SUCCEEDED|FAILED)|Upload|upload)' || true
          grep -q 'EXPORT SUCCEEDED' export-ios.log

      - &cleanup
        name: Remove keychain and key
        if: always()
        run: |
          [ -n "${SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/keys" ~/.netrc

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-ios-logs
          path: "*.log"
          if-no-files-found: ignore

  macos:
    name: macOS Developer ID
    runs-on: macos-26
    environment: release
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - *versions
      - *secrets
      - *cache

      - *keys

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild $XCODEBUILD_FLAGS -scheme rootshell-Standalone \
            -configuration ReleaseStandalone \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -archivePath "$RUNNER_TEMP/flightdeck-macos.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive | tee archive-macos.log | grep -E '(error|warning: .*(sign|profile|entitlement)|ARCHIVE (SUCCEEDED|FAILED))' || true
          grep -q 'ARCHIVE SUCCEEDED' archive-macos.log

      - name: Export with Developer ID
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        # Export re-signs the app and everything nested in it (helper,
        # extensions, frameworks) with Developer ID, hardened runtime and a
        # secure timestamp, each with its own entitlements.
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/flightdeck-macos.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export-macos" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee export-macos.log | grep -E '(error|EXPORT (SUCCEEDED|FAILED))' || true
          grep -q 'EXPORT SUCCEEDED' export-macos.log
          app=$(find "$RUNNER_TEMP/export-macos" -maxdepth 1 -name '*.app' | head -1)
          test -n "$app"
          echo "APP_PATH=$app" >> "$GITHUB_ENV"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|Timestamp|CodeDirectory)'

      - name: Notarize and staple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          notary=(--key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/notarize.zip"
          submitted=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${notary[@]}" --output-format json)
          id=$(plutil -extract id raw -o - - <<<"$submitted")
          echo "Notary submission $id"
          result=$(xcrun notarytool wait "$id" "${notary[@]}" --output-format json) || true
          status=$(plutil -extract status raw -o - - <<<"$result" 2>/dev/null || echo unknown)
          echo "Notarization $id: $status"
          if [ "$status" != Accepted ]; then
            xcrun notarytool log "$id" "${notary[@]}" || true
            echo "::error::notarization $id ended $status"
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl -a -vv "$APP_PATH" 2>&1 | tee spctl.log
          grep -q 'source=Notarized Developer ID' spctl.log

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="flightdeck-$TAG-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$zip"
          shasum -a 256 "$zip" | tee "$zip.sha256"
          prerelease=()
          case "$TAG" in *-rc*) prerelease=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" "$zip.sha256" --clobber
          else
            gh release create "$TAG" "$zip" "$zip.sha256" --verify-tag \
              --title "flightdeck $TAG" --generate-notes "${prerelease[@]}"
          fi

      - *cleanup

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-logs
          path: "*.log"
          if-no-files-found: ignore
