# The Apple build (docs/specs/ci-release.md 3.4): the Swift package tests, then the Xcode
# project generated from apple/project.yml, built for the iOS Simulator and for macOS, and the
# Kit package's tests on an iOS Simulator. Three xcode-ci jobs run in parallel: the two
# `swift test`s, the iOS build with the Simulator tests, and the macOS build. Each builds arm64
# only. The Simulator tests run on every event but a pull request: there the Kit's `swift test`
# covers the Kit, and the push to main runs them (spec 3.4). No signing, no secrets; the Mac app
# signs ad hoc (no Local.xcconfig in CI). It runs only when the app, the Swift package, the
# schema it is generated from, or the Go testdata the Swift tests read change. A Go change under
# api/ that alters the schema also regenerates swift/HabAPI, so the schema file and the testdata
# folders are enough. The live tests skip: they need a real hab.
# app-release.yml calls it on an app tag (workflow_call), so the release tests the tagged commit
# with these same inputs. The push that merges a pull request whose own full Apple run passed
# runs only the Simulator tests the pull request left out (spec 3.3); a direct push to main, a
# tag and a dispatch run everything.
name: Apple

on:
  push:
    branches: [main]
    paths: &apple
      - 'apple/**'
      - 'swift/HabAPI/**'
      - 'api/schema.json'
      - 'api/testdata/**'
      - 'api/modules/testdata/**'
      - 'design/icons/**'
      - 'internal/transcript/testdata/**'
      - 'internal/capcom/testdata/**'
      - 'cmd/gff-hab/testdata/console/**'
      - '.github/workflows/apple.yml'
  pull_request:
    paths: *apple
  workflow_dispatch:
  workflow_call:

concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      swift: ${{ steps.mode.outputs.swift }}
      builds: ${{ steps.mode.outputs.builds }}
      sim: ${{ steps.mode.outputs.sim }}
    steps:
      # Three switches, one per part: swift (the two `swift test`s), builds (the iOS and macOS
      # builds) and sim (the Kit's tests on an iOS Simulator).
      # A pull request runs swift and builds, never sim. A pull request whose files on the Apple
      # paths are all under api/ or swift/HabAPI/ (the schema, its testdata and the generated
      # package) runs swift only.
      # A push to main that merges a pull request whose full apple.yml run on its head passed
      # runs sim only; a Swift-only pull request gets all three on main. Any other push, a tag,
      # a dispatch and the release's call run all three. Any lookup that fails leaves all on.
      - name: Which parts run
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Prints "swift" when every changed file (and each rename's old name) on an Apple path
          # lies under api/ or swift/HabAPI/, else "full". Files off the Apple paths do not count.
          kind() {
            local files f any=false
            files=$(gh api --paginate "repos/$REPO/pulls/$1/files" --jq '.[] | .filename, (.previous_filename // empty)') || { echo full; return; }
            [ -n "$files" ] || { echo full; return; }
            while IFS= read -r f; do
              case "$f" in
                api/schema.json | api/testdata/* | api/modules/testdata/* | swift/HabAPI/*) any=true ;;
                apple/* | design/icons/* | internal/transcript/testdata/* | internal/capcom/testdata/* \
                  | cmd/gff-hab/testdata/console/* | .github/workflows/apple.yml)
                  echo full; return ;;
              esac
            done <<< "$files"
            if [ "$any" = true ]; then echo swift; else echo full; fi
          }
          swift=true
          builds=true
          sim=true
          if [ "$EVENT" = pull_request ]; then
            sim=false
            if [ -n "$PR" ] && [ "$(kind "$PR")" = swift ]; then
              echo "Only the API and the Swift package changed on the Apple paths: Swift tests only."
              builds=false
            fi
          fi
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            prs=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[] | select(.merged_at != null) | "\(.number) \(.head.sha)"') || prs=""
            while read -r number head; do
              [ -n "$number" ] || continue
              passed=$(gh run list -R "$REPO" --workflow apple.yml --commit "$head" --status success --limit 1 --json databaseId --jq 'length') || passed=0
              if [ "$passed" = 1 ] && [ "$(kind "$number")" = full ]; then
                echo "This push merges pull request #$number, whose full Apple run on $head passed: Simulator tests only."
                swift=false
                builds=false
                break
              fi
            done <<< "$prs"
          fi
          echo "swift=$swift builds=$builds sim=$sim"
          {
            echo "swift=$swift"
            echo "builds=$builds"
            echo "sim=$sim"
          } >> "$GITHUB_OUTPUT"

  # Three calls of xcode-ci, in parallel on three runners (spec 3.4). Each has its own
  # concurrency-key, compilation cache store and logs artifact, so the three never cancel each
  # other or share a cache key. Only the iOS and macOS jobs save the SwiftPM entry: the job that
  # runs only `swift test` would save it without the cloned packages the builds use.
  # Xcode 27.2 by path on the xcode-27 image; never the image default or a beta (spec 4).
  swift:
    name: Swift tests
    needs: plan
    if: needs.plan.outputs.swift == 'true'
    permissions:
      contents: read
    uses: noahkiss/workflows/.github/workflows/xcode-ci.yml@main
    with:
      runner: xcode-27
      xcode-app: /Applications/Xcode_27.2.app
      swift-test-dirs: |
        swift/HabAPI
        apple/FlightdeckKit
      # Resolve and test only the versions in each Package.resolved: a file that does not match its
      # Package.swift fails, instead of `swift test` rewriting it in silence (spec 3.4).
      swift-resolved-only: true
      spm-cache-key-file: apple/FlightdeckKit/Package.resolved
      spm-cache-save: false
      concurrency-key: swift
      logs-name: xcode-ci-logs-swift
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
      timeout-minutes: 45

  # The iOS build, and the Kit's tests on an iOS Simulator on every event but a pull request.
  # On the push that merges a pull request whose full run passed, the Simulator tests alone.
  # Resolve only the pinned versions; a drifted graph fails instead of floating (spec 5). A test
  # that hangs fails by name after 2 minutes (at most 5 with its own allowance), so the job
  # never sits until its own timeout with nothing in the log (spec 3.4). ARCHS=arm64: a generic
  # destination builds every arch in ARCHS, x86_64 too, and Intel is no target (spec 4).
  # The Xcode compilation cache is restored and saved between runs (spec 5).
  ios:
    name: iOS${{ needs.plan.outputs.builds == 'true' && ' build' || '' }}${{ needs.plan.outputs.builds == 'true' && needs.plan.outputs.sim == 'true' && ' and' || '' }}${{ needs.plan.outputs.sim == 'true' && ' Simulator tests' || '' }}
    needs: plan
    if: needs.plan.outputs.builds == 'true' || needs.plan.outputs.sim == 'true'
    permissions:
      contents: read
    uses: noahkiss/workflows/.github/workflows/xcode-ci.yml@main
    with:
      runner: xcode-27
      xcode-app: /Applications/Xcode_27.2.app
      generate: ${{ needs.plan.outputs.builds == 'true' && 'apple/scripts/generate.sh' || '' }}
      project: apple/Flightdeck.xcodeproj
      builds: ${{ needs.plan.outputs.builds == 'true' && 'FlightdeckiOS | generic/platform=iOS Simulator' || '' }}
      tests: ${{ needs.plan.outputs.sim == 'true' && 'FlightdeckKit-Package | ios-simulator | apple/FlightdeckKit' || '' }}
      compilation-cache: true
      compilation-cache-limit: 2G
      compilation-cache-key-suffix: ios
      xcodebuild-args: |
        -onlyUsePackageVersionsFromResolvedFile
        -test-timeouts-enabled
        YES
        -default-test-execution-time-allowance
        120
        -maximum-test-execution-time-allowance
        300
        ARCHS=arm64
      spm-cache-key-file: apple/FlightdeckKit/Package.resolved
      concurrency-key: ios
      logs-name: xcode-ci-logs-ios
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
      timeout-minutes: 75

  # The macOS build, ad hoc signed. The same arguments as the iOS job.
  mac:
    name: macOS build
    needs: plan
    if: needs.plan.outputs.builds == 'true'
    permissions:
      contents: read
    uses: noahkiss/workflows/.github/workflows/xcode-ci.yml@main
    with:
      runner: xcode-27
      xcode-app: /Applications/Xcode_27.2.app
      generate: apple/scripts/generate.sh
      project: apple/Flightdeck.xcodeproj
      builds: FlightdeckMac | generic/platform=macOS
      compilation-cache: true
      compilation-cache-limit: 2G
      compilation-cache-key-suffix: mac
      xcodebuild-args: |
        -onlyUsePackageVersionsFromResolvedFile
        -test-timeouts-enabled
        YES
        -default-test-execution-time-allowance
        120
        -maximum-test-execution-time-allowance
        300
        ARCHS=arm64
      spm-cache-key-file: apple/FlightdeckKit/Package.resolved
      concurrency-key: mac
      logs-name: xcode-ci-logs-mac
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
      timeout-minutes: 45
