# The Apple build (docs/specs/ci-release.md 3.4): the Swift package tests, then the Xcode
# project generated from apple/project.yml, built for the iOS Simulator and for macOS, and the
# Kit package's tests on an iOS Simulator. No signing, no secrets; the Mac app signs ad hoc (no
# Local.xcconfig in CI). It runs only when the app, the Swift package, the schema it is generated
# from, or the Go testdata the Swift tests read change. A Go change under api/ that alters the schema
# also regenerates swift/HabAPI, so the schema file and the testdata folders are enough. The live
# tests skip: they need a real hab.
# app-release.yml calls it on an app tag (workflow_call), so the release tests the tagged commit
# with these same inputs. The push that merges a pull request whose own Apple run passed builds
# nothing again (spec 3.3); a direct push to main, a tag and a dispatch always run.
name: Apple

on:
  push:
    branches: [main]
    paths: &apple
      - 'apple/**'
      - 'swift/HabAPI/**'
      - 'api/schema.json'
      - 'api/testdata/**'
      - 'api/modules/testdata/**'
      - 'design/icons/**'
      - 'internal/transcript/testdata/**'
      - 'internal/capcom/testdata/**'
      - 'cmd/gff-hab/testdata/console/**'
      - '.github/workflows/apple.yml'
  pull_request:
    paths: *apple
  workflow_dispatch:
  workflow_call:

concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run: ${{ steps.mode.outputs.run }}
      full: ${{ steps.mode.outputs.full }}
    steps:
      # Full or Swift only: a pull request whose files on the Apple paths are all under api/ or
      # swift/HabAPI/ (the schema, its testdata and the generated package) runs only the two
      # `swift test`s. Any other Apple path, a push, a tag and a dispatch run everything.
      # Skip only when this push to main merges a pull request whose apple.yml run on its head
      # passed in full; a Swift-only pull request gets its full run on main. Any lookup that
      # fails leaves it on and full.
      - name: Run, full or Swift only
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Prints "swift" when every changed file (and each rename's old name) on an Apple path
          # lies under api/ or swift/HabAPI/, else "full". Files off the Apple paths do not count.
          kind() {
            local files f any=false
            files=$(gh api --paginate "repos/$REPO/pulls/$1/files" --jq '.[] | .filename, (.previous_filename // empty)') || { echo full; return; }
            [ -n "$files" ] || { echo full; return; }
            while IFS= read -r f; do
              case "$f" in
                api/schema.json | api/testdata/* | api/modules/testdata/* | swift/HabAPI/*) any=true ;;
                apple/* | design/icons/* | internal/transcript/testdata/* | internal/capcom/testdata/* \
                  | cmd/gff-hab/testdata/console/* | .github/workflows/apple.yml)
                  echo full; return ;;
              esac
            done <<< "$files"
            if [ "$any" = true ]; then echo swift; else echo full; fi
          }
          run=true
          full=true
          if [ "$EVENT" = pull_request ] && [ -n "$PR" ] && [ "$(kind "$PR")" = swift ]; then
            echo "Only the API and the Swift package changed on the Apple paths: Swift tests only."
            full=false
          fi
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            prs=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[] | select(.merged_at != null) | "\(.number) \(.head.sha)"') || prs=""
            while read -r number head; do
              [ -n "$number" ] || continue
              passed=$(gh run list -R "$REPO" --workflow apple.yml --commit "$head" --status success --limit 1 --json databaseId --jq 'length') || passed=0
              if [ "$passed" = 1 ] && [ "$(kind "$number")" = full ]; then
                echo "This push merges pull request #$number, whose full Apple run on $head passed: nothing to run."
                run=false
                break
              fi
            done <<< "$prs"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"

  apple:
    name: Apple (${{ needs.plan.outputs.full == 'true' && 'full' || 'Swift only' }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    permissions:
      contents: read
    uses: noahkiss/workflows/.github/workflows/xcode-ci.yml@main
    with:
      # Xcode 27.1 by path on the xcode-27 image; never the image default or a beta (spec 4).
      runner: xcode-27
      xcode-app: /Applications/Xcode_27.1.app
      swift-test-dirs: |
        swift/HabAPI
        apple/FlightdeckKit
      # Swift only: empty generate, builds and tests skip those steps in xcode-ci.
      generate: ${{ needs.plan.outputs.full == 'true' && 'apple/scripts/generate.sh' || '' }}
      project: apple/Flightdeck.xcodeproj
      # fromJSON turns the \n in the JSON string into the line break between the two builds.
      builds: ${{ needs.plan.outputs.full == 'true' && fromJSON('"FlightdeckiOS | generic/platform=iOS Simulator\nFlightdeckMac | generic/platform=macOS"') || '' }}
      tests: ${{ needs.plan.outputs.full == 'true' && 'FlightdeckKit-Package | ios-simulator | apple/FlightdeckKit' || '' }}
      # Resolve only the pinned versions; a drifted graph fails instead of floating (spec 5). A test
      # that hangs fails by name after 2 minutes (at most 5 with its own allowance), so the job
      # never sits until its own timeout with nothing in the log (spec 3.4).
      xcodebuild-args: |
        -onlyUsePackageVersionsFromResolvedFile
        -test-timeouts-enabled
        YES
        -default-test-execution-time-allowance
        120
        -maximum-test-execution-time-allowance
        300
      spm-cache-key-file: apple/FlightdeckKit/Package.resolved
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
      timeout-minutes: 90
