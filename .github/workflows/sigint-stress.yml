# TEMPORARY: stress TestHeavySignalWhileHabDown on Linux. Removed before the PR merges.
name: SIGINT stress

on:
  # A dispatch needs the file on the default branch; a push to this branch runs it meanwhile.
  push:
    branches: [sigint-hang]
  workflow_dispatch:
    inputs:
      count:
        description: Iterations per job
        default: '1000'

permissions:
  contents: read

jobs:
  stress:
    name: ${{ matrix.build }} ${{ matrix.shape }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build: [race, plain]
        shape: [alone, cpu, neighbours]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the test binary
        env:
          BUILD: ${{ matrix.build }}
        run: |
          set -euo pipefail
          if [ "$BUILD" = race ]; then flags=-race; else flags=; fi
          go test $flags -c -o "$RUNNER_TEMP/gffhab.test" ./cmd/gff-hab
      - name: Run
        env:
          SHAPE: ${{ matrix.shape }}
          COUNT: ${{ inputs.count || '1000' }}
          GFF_TEST_TIMEOUT_SCALE: '3'
        working-directory: cmd/gff-hab
        run: |
          set -uo pipefail
          nproc
          pids=()
          if [ "$SHAPE" = cpu ]; then
            for _ in $(seq "$(nproc)"); do (while :; do :; done) & pids+=("$!"); done
          fi
          if [ "$SHAPE" = neighbours ]; then
            run='TestHeavy'
            count=$(( COUNT / 4 ))
          else
            run='TestHeavySignalWhileHabDown$'
            count=$COUNT
          fi
          "$RUNNER_TEMP/gffhab.test" -test.run "$run" -test.count "$count" -test.parallel 2 \
            -test.timeout 55m -test.v > "$RUNNER_TEMP/out.txt" 2>&1 && code=0 || code=$?
          [ "${#pids[@]}" -gt 0 ] && kill "${pids[@]}"
          echo "exit $code"
          echo "pass: $(grep -c -- '--- PASS: TestHeavySignalWhileHabDown' "$RUNNER_TEMP/out.txt")"
          echo "fail: $(grep -c -- '--- FAIL: TestHeavySignalWhileHabDown' "$RUNNER_TEMP/out.txt")"
          grep -n -A200 -- '--- FAIL' "$RUNNER_TEMP/out.txt" | head -600 || true
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: out-${{ matrix.build }}-${{ matrix.shape }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/out.txt
