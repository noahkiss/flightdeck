# Refuse local-context leaks on every push and pull request, docs included
# (docs/specs/ci-release.md 9). No path filter: docs are where leaks happen most.
# Private rules come from the repo secret HYGIENE_PATTERNS; a fork's pull request gets none and
# runs the built-in rules only. A hit prints file, line and rule name, never the matched text.
name: Hygiene

on:
  push:
  pull_request:
    # edited: a changed title or body is new pushed text too.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# A push scans only its own before..after range, so a cancelled push run would leave that range
# unscanned: push runs never cancel. A pull request run scans the whole pull request, so a newer
# one may replace an older one.
concurrency:
  group: hygiene-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scan:
    name: Hygiene scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # gawk, not the image's default awk, so a private rule behaves as on a dev box with gawk.
      - name: Install gawk
        run: |
          command -v gawk >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q gawk; }
          gawk --version | head -1

      - name: Scan
        # Every event value reaches the script through env, never interpolated into it. The
        # branch name and the pull request's title and body are read inside the step, not set in
        # env:, because the log prints a step's env: block and a hit's text must not reach it.
        env:
          GFF_HYGIENE_AWK: gawk
          GFF_HYGIENE_PATTERNS: ${{ secrets.HYGIENE_PATTERNS }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
        run: |
          set -eu
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = push ]; then
            export GFF_HYGIENE_REF="$GITHUB_REF_NAME"
          fi
          if [ "$EVENT" = pull_request ]; then
            GFF_HYGIENE_PR_TITLE=$(jq -r '.pull_request.title // ""' "$GITHUB_EVENT_PATH")
            GFF_HYGIENE_PR_BODY=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
            export GFF_HYGIENE_PR_TITLE GFF_HYGIENE_PR_BODY
            exec scripts/hygiene-scan.sh --range "$PR_BASE..$PR_HEAD"
          fi
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] &&
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            exec scripts/hygiene-scan.sh --range "$BEFORE..$AFTER"
          fi
          # A new branch or tag, a dispatch, or a force push whose old head is gone: the whole
          # tree, then every commit not on main.
          rc=0
          scripts/hygiene-scan.sh --tree || rc=$?
          if git rev-parse --verify --quiet origin/main >/dev/null; then
            r=0
            scripts/hygiene-scan.sh --range "origin/main..$AFTER" || r=$?
            if [ "$r" -gt "$rc" ]; then rc=$r; fi
          fi
          exit "$rc"
