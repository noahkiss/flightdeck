# The slow Linux suites, once a night (docs/specs/ci-release.md 3.6): the full Go set on main as
# it is now (`make ci-full`, so a break from merge skew shows by the next morning), split into the
# five shards of ci.yml's go (full) jobs; and in a job of its own, so it runs whatever the shards
# do, the holderproto fuzz targets, the 200-cycle restart loop of core test 1, and core tests 2
# and 13 under systemd (scripts/service-check.sh). One more job keeps the linux arm64 libghostty
# cache warm for releases. A scheduled night when main has not moved since the last passing run
# costs one short job; a dispatch always runs everything.
name: Nightly

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.guard.outputs.run }}
      ghostty_key: ${{ steps.key.outputs.ghostty_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: libghostty cache key
        id: key
        run: |
          set -euo pipefail
          commit=$(make -s ghostty-id) # the pinned commit and the patch id
          zig=$(sed -n 's/^zig = "\(.*\)"$/\1/p' mise.toml)
          [ -n "$commit" ] && [ -n "$zig" ] || { echo "::error::cannot read GHOSTTY_COMMIT or the zig pin"; exit 1; }
          echo "ghostty_key=libghostty-${commit}-zig${zig}" >> "$GITHUB_OUTPUT"

      - name: Skip when main has not moved
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run=true
          if [ "$EVENT" = schedule ]; then
            last=$(gh run list -R "$REPO" --workflow nightly.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""') || last=""
            if [ "$last" = "$SHA" ]; then
              echo "main is still at $SHA, which last night's run passed; nothing to do."
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # Shard 0/4 is check-pure, vet and every package but cmd/gff-hab; shards 1/4 to 4/4 each run a
  # quarter of cmd/gff-hab's tests in make test and make race (scripts/go-test-split.sh, spec
  # 3.2). In one job, cmd/gff-hab's race list at -count=3 alone ran past the 30-minute RACE_TIMEOUT.
  suites:
    name: Nightly suites ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/4', '1/4', '2/4', '3/4', '4/4']
    permissions:
      contents: read
    uses: noahkiss/workflows/.github/workflows/go-ci.yml@main
    with:
      fmt: false
      mise: true
      cache-path: build/libghostty-vt
      cache-key: ${{ needs.plan.outputs.ghostty_key }}-Linux-X64-baseline
      cancel-in-progress: false
      concurrency-key: ${{ matrix.shard }}
      # GHOSTTY_ZIGFLAGS is inline because go-ci has no env input: on a cache miss, make builds
      # the baseline libghostty the -baseline key promises. RACE_COUNT stays at its default, 3.
      commands: >-
        GFF_TEST_TIMEOUT_SCALE=3 make
        ${{ matrix.shard == '0/4' && 'ci-full' || 'test race' }}
        GO_TEST_SHARD=${{ matrix.shard }}
        GHOSTTY_ZIGFLAGS='-Dtarget=x86_64-linux-gnu.2.31 -Dcpu=baseline'
      timeout-minutes: 45

  # Fuzz, the restart loop and the service check, apart from the shards so a failing shard never
  # skips them.
  slow:
    name: Fuzz, restart loop and service check
    needs: plan
    if: needs.plan.outputs.run == 'true'
    permissions:
      contents: read
    uses: noahkiss/workflows/.github/workflows/go-ci.yml@main
    with:
      fmt: false
      mise: true
      cache-path: build/libghostty-vt
      cache-key: ${{ needs.plan.outputs.ghostty_key }}-Linux-X64-baseline
      cancel-in-progress: false
      concurrency-key: slow
      # make libghostty restores or builds the baseline library the restart loop links.
      # A raw `-tags ghostty` command needs the Makefile's pkg-config path to find libghostty.
      # service-check needs a systemd user manager, so the runner user gets lingering first,
      # and the job fails loudly when the user bus never appears.
      commands: |
        make libghostty GHOSTTY_ZIGFLAGS='-Dtarget=x86_64-linux-gnu.2.31 -Dcpu=baseline'
        make fuzz FUZZTIME=30s
        PKG_CONFIG_PATH="$PWD/build/libghostty-vt/share/pkgconfig" CGO_ENABLED=1 GFF_TEST_TIMEOUT_SCALE=3 GFF_RESTART_LOOP=200 go test -tags ghostty -run TestRestartLoop ./internal/link/
        sudo loginctl enable-linger "$USER"
        export XDG_RUNTIME_DIR="/run/user/$(id -u)"
        for _ in $(seq 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
        [ -S "$XDG_RUNTIME_DIR/bus" ] || { echo "::error::no systemd user bus at $XDG_RUNTIME_DIR/bus after 30 s"; exit 1; }
        scripts/service-check.sh
      timeout-minutes: 40

  # The linux arm64 release leg restores this entry; building it here keeps a release warm.
  warm-arm64:
    name: Warm the arm64 libghostty cache
    needs: plan
    if: needs.plan.outputs.run == 'true'
    permissions:
      contents: read
    uses: noahkiss/workflows/.github/workflows/go-ci.yml@main
    with:
      runner: ubuntu-24.04-arm
      fmt: false
      mise: true
      cache-path: build/libghostty-vt
      cache-key: ${{ needs.plan.outputs.ghostty_key }}-Linux-ARM64-baseline
      cancel-in-progress: false
      commands: make libghostty GHOSTTY_ZIGFLAGS='-Dtarget=aarch64-linux-gnu.2.31 -Dcpu=baseline'
      timeout-minutes: 30
