# Go on macOS (docs/specs/ci-release.md 3.5): macOS PTYs and launchd differ from Linux, so the
# holder packages run here when they change, plus a nightly run (owner decision, 2026-10-31).
# A change: the holder group under -race three times, a copy-truncate under launchd
# (diagnostics.md test 2), then every test with libghostty. The
# nightly run and a dispatch add core tests 2 and 13 under launchd (scripts/service-check.sh,
# with the GFF_SVC_RUN=1 opt-in it needs on macOS); a
# scheduled run is skipped when main has not moved since the last passing nightly run, and the push
# that merges a pull request whose own run passed is skipped too: that night's run covers the merge.
# The paths include the parser (internal/vt), the build pins (Makefile, go.mod, go.sum, mise.toml)
# and our Ghostty patches (third_party/ghostty).
# The image's /bin/bash is 3.2 and it has no Homebrew bash, so the job installs one: the marked
# shell tests need bash 4.4 (PS0), and with GFF_TEST_BASH set they fail rather than skip.
name: macOS Go

on:
  push:
    branches: [main]
    paths: &holder
      - 'internal/holder/**'
      - 'internal/holderproto/**'
      - 'internal/holderclient/**'
      - 'internal/holderreg/**'
      - 'internal/link/**'
      - 'internal/service/**'
      - 'internal/grants/**'
      - 'internal/vt/**'
      - 'third_party/ghostty/**'
      - 'cmd/gff-hab-holder/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - 'mise.toml'
      - 'scripts/go-test-split.sh'
      - 'scripts/service-check.sh'
      - 'scripts/dev-sweep.sh'
      - 'scripts/macos-bundle.sh'
      - '.github/workflows/macos-go.yml'
  pull_request:
    paths: *holder
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:

concurrency:
  group: macos-go-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run: ${{ steps.guard.outputs.run }}
      ghostty_key: ${{ steps.key.outputs.ghostty_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: libghostty cache key
        id: key
        run: |
          set -euo pipefail
          commit=$(make -s ghostty-id) # the pinned commit and the patch id
          zig=$(sed -n 's/^zig = "\(.*\)"$/\1/p' mise.toml)
          [ -n "$commit" ] && [ -n "$zig" ] || { echo "::error::cannot read GHOSTTY_COMMIT or the zig pin"; exit 1; }
          echo "ghostty_key=libghostty-${commit}-zig${zig}" >> "$GITHUB_OUTPUT"

      - name: Skip a nightly run when main has not moved, and a merge already tested
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run=true
          if [ "$EVENT" = schedule ]; then
            last=$(gh run list -R "$REPO" --workflow macos-go.yml --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // ""') || last=""
            if [ "$last" = "$SHA" ]; then
              echo "main is still at $SHA, which the last nightly run passed; nothing to do."
              run=false
            fi
          fi
          if [ "$EVENT" = push ]; then
            heads=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null) | .head.sha] | join(" ")') || heads=""
            for head in $heads; do
              passed=$(gh run list -R "$REPO" --workflow macos-go.yml --commit "$head" --status success --limit 1 --json databaseId --jq 'length') || passed=0
              if [ "$passed" = 1 ]; then
                echo "This push merges a pull request whose run on $head passed; the nightly run covers the merge."
                run=false
                break
              fi
            done
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  go:
    name: Go on macOS
    needs: plan
    if: needs.plan.outputs.run == 'true'
    permissions:
      contents: read
    uses: noahkiss/workflows/.github/workflows/go-ci.yml@main
    with:
      runner: macos-26
      fmt: false
      mise: true
      cache-path: build/libghostty-vt
      cache-key: ${{ needs.plan.outputs.ghostty_key }}-macOS-ARM64-baseline
      cancel-in-progress: ${{ github.event_name != 'schedule' && github.ref != 'refs/heads/main' }}
      commands: |
        HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install bash && export GFF_TEST_BASH="$(brew --prefix)/bin/bash"
        GFF_TEST_TIMEOUT_SCALE=3 go test -race -count=3 ./internal/holder/... ./internal/holderproto/... ./internal/holderclient/... ./internal/holderreg/... ./internal/link/... ./internal/service/... ./internal/grants/... ./cmd/gff-hab-holder/...
        GFF_INIT_APPEND_TEST=1 go test -count=1 -v -run TestCopyTruncateUnderInit ./internal/service/
        GFF_TEST_TIMEOUT_SCALE=3 make test
        ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'GFF_SVC_RUN=1 scripts/service-check.sh' || '' }}
      timeout-minutes: 60

  # A scheduled run on main keeps one issue (docs/specs/ci-release.md 3.8): a failure opens it or
  # comments on it, and the next passing scheduled run closes it. Only this job writes issues.
  report:
    name: Report a scheduled run
    needs: [plan, go]
    if: always() && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/scheduled-ci-report.sh
          sparse-checkout-cone-mode: false

      - name: Open, comment on or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          SELF_JOB: Report a scheduled run
        run: scripts/scheduled-ci-report.sh
