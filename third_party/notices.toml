# Third-party notices: the code we did not write that ends up in what we publish.
#
# internal/notices reads this file, the licence texts under third_party/licenses/, go.mod with the
# Go module cache, and apple/FlightdeckKit/Package.resolved, and writes two files:
#   NOTICE                       release archives and the helper bundles (set "release")
#   apple/App/Acknowledgements.txt  the Flightdeck app (set "app")
# Run `make notices` after a change; `make check-gen` fails when either file is stale, and the
# generator fails when a Swift package has no [[swift]] entry or a Go module has no licence file.
#
# [[component]]: code that is not a Go module or a Swift package (C libraries, Zig packages, fonts,
# data). `files` are paths from the repository root. Each of `release` and `app` says where the
# component sits in that set (`in`) and which version (`version`: "make:VAR" reads the Makefile,
# "mise:tool" reads mise.toml, anything else is printed as written). A component without a table
# for a set is not in that set.
#
# [[swift]]: one entry per package pinned in Package.resolved. Its licence texts are every file
# under third_party/licenses/swift/<identity>/, copied from the package at the pinned revision.

